name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'vanguard/**'
      - '!vanguard/test.js'
      - '!vanguard/README.md'
      - '!vanguard/Makefile'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy-vanguard:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    # Serialize deploys so GCP is never asked to run two operations at once.
    # cancel-in-progress: false means a queued run waits rather than being dropped.
    concurrency:
      group: deploy-vanguard
      cancel-in-progress: false
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v7

      - name: 'Check if commit is still latest'
        id: check-latest
        run: |
          LATEST=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$LATEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine HEAD, proceeding with deploy"
          elif [ "${{ github.sha }}" = "$LATEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: ${{ github.sha }} is stale (HEAD is now $LATEST)"
          fi

      - name: 'Check secrets'
        if: steps.check-latest.outputs.is_latest == 'true'
        env:
          WIF_PROVIDER_NAME: ${{ secrets.WIF_PROVIDER_NAME }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
        run: |
          if [ -z "$WIF_PROVIDER_NAME" ]; then echo "WIF_PROVIDER_NAME secret is not set"; exit 1; fi
          if [ -z "$GCP_SERVICE_ACCOUNT" ]; then echo "GCP_SERVICE_ACCOUNT secret is not set"; exit 1; fi
          if [ -z "$GCP_PROJECT_ID" ]; then echo "GCP_PROJECT_ID secret is not set"; exit 1; fi
          if [ -z "$GA_MEASUREMENT_ID" ]; then echo "GA_MEASUREMENT_ID secret is not set"; exit 1; fi
          if [ -z "$GA_API_SECRET" ]; then echo "GA_API_SECRET secret is not set"; exit 1; fi

      - id: 'auth'
        if: steps.check-latest.outputs.is_latest == 'true'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER_NAME }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - id: 'deploy'
        if: steps.check-latest.outputs.is_latest == 'true'
        uses: 'google-github-actions/deploy-cloud-functions@v4'
        timeout-minutes: 10
        with:
          name: 'vanguard'
          runtime: 'nodejs24'
          source_dir: 'vanguard'
          entry_point: 'vanguard'
          region: 'us-central1'
          memory: '128Mi'
          max_instance_request_concurrency: 1
          max_instance_count: 2
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          environment_variables: 'GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }},GA_API_SECRET=${{ secrets.GA_API_SECRET }},LOG_UPSTREAM_REQUESTS=1'
